<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Teknik Komputer Jaringan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff0f5;
  --kartu: #ffffff;
  --teks: #4a2e35;
  --teks-redup: #8c6b73;
  --garis: #f7d6e0;
  --aksen: #d8819d;
  --pita: #f4acb7;
  --btn-tambah: #e5989b;
  --btn-tambah-hover: #b56576;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2b1e23;
    --kartu: #3a2830;
    --teks: #fce1e4;
    --teks-redup: #d4a3ae;
    --garis: #523945;
    --aksen: #f4acb7;
    --pita: #6d4355;
    --btn-tambah: #b56576;
    --btn-tambah-hover: #e5989b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--teks);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5;
}
.wadah { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; }
header h1 { margin: 0 0 4px; font-size: 1.75rem; font-weight: 800; color: var(--teks); }
header p { margin: 0; color: var(--teks-redup); }
.btn-tambah {
  background: var(--btn-tambah);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s ease;
}
.btn-tambah:hover { background: var(--btn-tambah-hover); }
.kontrol { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 8px; }
.kontrol input, .kontrol select {
  font: inherit;
  color: var(--teks);
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 10px;
  padding: 10px 12px;
}
.kontrol input { flex: 1 1 220px; }
.kontrol select { flex: 0 1 180px; }
.kontrol input:focus-visible, .kontrol select:focus-visible {
  outline: 2px solid var(--aksen);
  outline-offset: 1px;
}
.jumlah { color: var(--teks-redup); font-size: 0.9rem; margin: 0 0 16px; }
.daftar {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.kartu {
  background: var(--kartu);
  border: 1px solid var(--garis);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pita { height: 60px; background: var(--pita); }
.isi { padding: 0 16px 16px; text-align: center; flex: 1; display: flex; flex-direction: column; }
.foto {
  width: 76px; height: 76px;
  margin: -38px auto 8px;
  border-radius: 50%;
  border: 4px solid var(--kartu);
  background: #ffe5ec;
  color: #b56576;
  display: grid; place-items: center; font-weight: 800; font-size: 1.5rem; overflow: hidden;
}
.foto img { width: 100%; height: 100%; object-fit: cover; }
.nama { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--teks); }
.nis { margin: 0 0 12px; color: var(--teks-redup); font-size: 0.85rem; }
.rincian { margin: 0 0 16px; text-align: left; font-size: 0.85rem; flex: 1; }
.rincian div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 0; border-top: 1px solid var(--garis);
}
.rincian dt { color: var(--teks-redup); }
.rincian dd { margin: 0; font-weight: 600; text-align: right; color: var(--teks); }
.aksi { display: flex; justify-content: center; gap: 8px; margin-top: auto; padding-top: 8px; }
.btn-edit, .btn-hapus {
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  color: #fff;
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.2s ease;
}
.btn-edit { background: #e09f67; }
.btn-edit:hover { background: #c8834a; }
.btn-hapus { background: #e67070; }
.btn-hapus:hover { background: #c94f4f; }
.pesan { grid-column: 1 / -1; text-align: center; padding: 40px 16px; color: var(--teks-redup); }
.pesan.galat { color: #d9534f; }
@media (prefers-color-scheme: dark) { .pesan.galat { color: #ff9b9b; } }
</style>
</head>
<body>
<div class="wadah">
  <header>
    <div>
      <h1>Teknik Komputer Jaringan</h1>
      <p>Cari berdasarkan role.</p>
    </div>
    <button id="btntambah" class="btn-tambah" onclick="bukaFormTambah()">+ Tambah Data</button>
  </header>
  <div class="kontrol">
    <input id="cari" type="search" placeholder="Cari nama, NIS, atau NIP" aria-label="Cari nama, NIS, atau NIP">
    <select id="filterRole" aria-label="Filter role">
      <option value="">Semua (Guru / Siswa)</option>
      <option value="Siswa">Siswa</option>
      <option value="Guru">Guru</option>
    </select>
    <select id="filterKelas" aria-label="Filter kelas">
      <option value="">Semua Kelas / Mapel</option>
    </select>
  </div>
  <p id="jumlah" class="jumlah" aria-live="polite"></p>
  <main id="daftar" class="daftar"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// KONEKSI SUPABASE PROYEK KAMU
const SUPABASE_URL = "https://lofuhkytztjtcvqgnvtf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7N_8hFNSbosvLAvv9565KA_V6RMi1Ju";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const elDaftar = document.getElementById("daftar");
const elJumlah = document.getElementById("jumlah");
const elCari = document.getElementById("cari");
const elKelas = document.getElementById("filterKelas");
const elRole = document.getElementById("filterRole");
let semuaData = [];

async function muatData() {
  tampilkanPesan("Memuat data...");

  // Mengambil tabel siswa dan guru secara aman
  const resSiswa = await db.from("siswa").select("*");
  const resGuru = await db.from("guru").select("*");

  const dataSiswa = resSiswa.data || [];
  const dataGuru = resGuru.data || [];

  // Format data siswa
  const siswaFormatted = dataSiswa.map(s => ({
    ...s,
    role: "Siswa",
    nomorId: "NIS. " + (s.nis || "-"),
    grup: s.kelas || "-"
  }));

  // Format data guru (mencakup opsi kolom 'jurusan', 'mapel', atau 'kelas')
  const guruFormatted = dataGuru.map(g => ({
    ...g,
    role: "Guru",
    nomorId: "NIP. " + (g.nip || "-"),
    grup: g.jurusan || g.mapel || g.kelas || "-"
  }));

  semuaData = [...siswaFormatted, ...guruFormatted];
  
  isiPilihanKelas();
  tampilkanData();
}

function tampilkanData() {
  const kataKunci = elCari.value.trim().toLowerCase();
  const kelasDipilih = elKelas.value;
  const roleDipilih = elRole.value;

  const hasil = semuaData.filter((item) => {
    const cocokRole = !roleDipilih || item.role === roleDipilih;
    const cocokKelas = !kelasDipilih || item.grup === kelasDipilih;
    
    const idCari = String(item.nis || item.nip || "");
    const namaCari = String(item.nama || "");
    const cocokCari = !kataKunci || 
                      namaCari.toLowerCase().includes(kataKunci) || 
                      idCari.toLowerCase().includes(kataKunci);
                      
    return cocokRole && cocokKelas && cocokCari;
  });

  elJumlah.textContent = hasil.length + " dari " + semuaData.length + " data";
  elDaftar.replaceChildren();

  if (hasil.length === 0) {
    tampilkanPesan("Tidak ada data yang cocok.");
    return;
  }

  hasil.forEach((item) => elDaftar.appendChild(buatKartu(item)));
}

function buatKartu(item) {
  const kartu = el("article", "kartu");
  kartu.appendChild(el("div", "pita"));
  const isi = el("div", "isi");

  const foto = el("div", "foto");
  if (item.foto_url) {
    const gambar = document.createElement("img");
    gambar.src = item.foto_url;
    gambar.alt = "Foto " + item.nama;
    gambar.loading = "lazy";
    gambar.onerror = () => foto.replaceChildren(document.createTextNode(inisial(item.nama)));
    foto.appendChild(gambar);
  } else {
    foto.textContent = inisial(item.nama);
  }

  isi.appendChild(foto);
  isi.appendChild(el("h2", "nama", item.nama || "-"));
  isi.appendChild(el("p", "nis", item.nomorId));

  const rincian = el("dl", "rincian");
  tambahBaris(rincian, item.role === "Guru" ? "jabatan" : "Kelas", item.grup);
  if (item.jenis_kelamin) tambahBaris(rincian, "Jenis kelamin", item.jenis_kelamin);
  if (item.tanggal_lahir) tambahBaris(rincian, "Tanggal lahir", formatTanggal(item.tanggal_lahir));
  if (item.alamat) tambahBaris(rincian, "Alamat", item.alamat);
  
  isi.appendChild(rincian);

  const aksi = el("div", "aksi");
  const btnEdit = el("button", "btn-edit", "Edit");
  const btnHapus = el("button", "btn-hapus", "Hapus");
  aksi.appendChild(btnEdit);
  aksi.appendChild(btnHapus);
  
  isi.appendChild(aksi);
  kartu.appendChild(isi);
  return kartu;
}

function el(tag, kelas, teks) {
  const e = document.createElement(tag);
  if (kelas) e.className = kelas;
  if (teks) e.textContent = teks;
  return e;
}

function tambahBaris(dl, label, nilai) {
  if (!nilai) return;
  const baris = el("div");
  baris.appendChild(el("dt", "", label));
  baris.appendChild(el("dd", "", nilai));
  dl.appendChild(baris);
}

function inisial(nama) {
  if (!nama) return "?";
  return nama.split(" ").filter(Boolean).slice(0, 2).map((k) => k[0].toUpperCase()).join("");
}

function formatTanggal(teks) {
  if (!teks) return "";
  return new Date(teks + "T00:00:00").toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
}

function tampilkanPesan(teks, galat) {
  elDaftar.replaceChildren(el("p", "pesan" + (galat ? " galat" : ""), teks));
}

function isiPilihanKelas() {
  elKelas.innerHTML = '<option value="">Semua Kelas / Mapel</option>';
  const daftarGrup = [...new Set(semuaData.map((d) => d.grup).filter(Boolean))].sort();
  daftarGrup.forEach((g) => {
    const opsi = el("option", "", g);
    opsi.value = g;
   elkelas.appendchild(opsi);
  });
}

elCari.addEventListener("input", tampilkanData);
elKelas.addEventListener("change", tampilkanData);
elRole.addEventListener("change", tampilkanData);
   
muatData();
</script>
</body>
</html>

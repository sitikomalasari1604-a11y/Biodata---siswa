<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1423">
    <title>Biodata Siswa dan Guru</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
<style>
/* ==============================
   TEMA DAN PENGATURAN DASAR
============================== */
:root {
    color-scheme: dark;
    --bg: #0d1423;
    --kartu: #172238;
    --teks: #edf2ff;
    --redup: #9aa8c0;
    --garis: #344158;
    --aksen: #1764d8;
    --hapus: #ff7777;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-width: 320px;
    background: var(--bg);
    color: var(--teks);
    font-family: "Plus Jakarta Sans", sans-serif;
    line-height: 1.5;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* ==============================
   LAYOUT UTAMA DAN HEADER
============================== */
.wadah {
    width: min(100% - 40px, 1120px);
    margin: 0 auto;
    padding: 42px 0 56px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 22px;
    margin-bottom: 28px;
}

h1 {
    margin: 0 0 7px;
    font-size: clamp(1.8rem, 4vw, 2.65rem);
    line-height: 1.18;
    letter-spacing: -.045em;
    font-weight: 800;
}

header p {
    margin: 0;
    color: var(--redup);
    font-size: 1.05rem;
}

/* ==============================
   TOMBOL
============================== */
.btn-tambah, .btn-simpan {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 48px;
    padding: 11px 19px;
    border: 0;
    border-radius: 12px;
    background: var(--aksen);
    color: #fff;
    font-weight: 700;
    transition: background .2s, transform .2s;
}

.btn-tambah:hover, .btn-simpan:hover {
    background: #2878ec;
    transform: translateY(-1px);
}

button:disabled {
    opacity: .55;
    cursor: wait;
}

/* ==============================
   PENCARIAN DAN FILTER
============================== */
.kontrol {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(170px, 220px) minmax(170px, 220px);
    gap: 12px;
    margin: 0 0 14px;
}

.kontrol input, .kontrol select,
.form-grup input, .form-grup select {
    width: 100%;
    min-width: 0;
    min-height: 50px;
    padding: 11px 14px;
    border: 1px solid var(--garis);
    border-radius: 12px;
    background: var(--kartu);
    color: var(--teks);
    outline: none;
}

.kontrol input::placeholder,
.form-grup input::placeholder {
    color: #8794aa;
}

.kontrol input:focus, .kontrol select:focus,
.form-grup input:focus, .form-grup select:focus {
    border-color: #4388f5;
    box-shadow: 0 0 0 3px rgba(67, 136, 245, .14);
}

.jumlah {
    margin: 14px 0 22px;
    color: var(--redup);
    font-size: .95rem;
}

/* ==============================
   BAGIAN GURU DAN SISWA
============================== */
.guru-section {
    margin: 30px 0;
}

.bagian-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.bagian-header h2 {
    margin: 0;
    font-size: 1.35rem;
    letter-spacing: -.02em;
}

.daftar-guru, .daftar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
    gap: 20px;
}

/* ==============================
   KARTU PROFIL
============================== */
.kartu {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--garis);
    border-radius: 22px;
    background: var(--kartu);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
}

.pita {
    height: 94px;
    flex: 0 0 94px;
    background: #0753bd;
}

.isi {
    flex: 1;
    padding: 0 20px 18px;
    text-align: center;
}

.foto {
    display: grid;
    place-items: center;
    width: 112px;
    height: 112px;
    margin: -62px auto 12px;
    overflow: hidden;
    border: 6px solid var(--kartu);
    border-radius: 50%;
    background: #dbeafe;
    color: #174ea6;
    font-size: 1.55rem;
    font-weight: 800;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .2);
}

.foto img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.nama {
    margin: 0 0 3px;
    font-size: 1.25rem;
    line-height: 1.35;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.nis {
    margin: 0 0 20px;
    color: var(--redup);
    font-size: .95rem;
}

.rincian {
    margin: 0;
    text-align: left;
    font-size: .94rem;
}

.rincian div {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding: 11px 0;
    border-top: 1px solid var(--garis);
}

.rincian dt {
    flex: 0 0 auto;
    color: var(--redup);
}

.rincian dd {
    min-width: 0;
    margin: 0;
    color: var(--teks);
    font-weight: 700;
    text-align: right;
    overflow-wrap: anywhere;
}

/* ==============================
   TOMBOL AKSI KARTU
============================== */
.kartu-aksi {
    display: flex;
    border-top: 1px solid var(--garis);
    background: rgba(255, 255, 255, .015);
}

.kartu-aksi button {
    flex: 1;
    min-height: 46px;
    padding: 10px;
    border: 0;
    background: transparent;
    font-size: .9rem;
    font-weight: 700;
}

.btn-edit { color: #79aaff; }

.btn-hapus {
    color: var(--hapus);
    border-left: 1px solid var(--garis) !important;
}

/* Guru memakai struktur pita dan avatar yang sama */
.kartu-guru .isi {
    padding-top: 0;
}

.kartu-guru .nama {
    margin-bottom: 5px;
}

.kartu-guru .nis {
    margin-bottom: 15px;
}

/* ==============================
   MODAL FORM
============================== */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    place-items: center;
    padding: 16px;
    background: rgba(0, 0, 0, .72);
    backdrop-filter: blur(5px);
}

.modal-konten {
    width: 100%;
    max-width: 480px;
    max-height: min(90vh, 800px);
    overflow-y: auto;
    padding: 25px;
    border: 1px solid var(--garis);
    border-radius: 18px;
    background: var(--kartu);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
}

.modal-konten h2 {
    margin: 0 0 20px;
    font-size: 1.35rem;
}

.form-grup {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
}

.form-grup label {
    color: var(--redup);
    font-size: .9rem;
    font-weight: 700;
}

.modal-tombol {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
}

.btn-batal {
    min-height: 44px;
    padding: 9px 16px;
    border: 1px solid var(--garis);
    border-radius: 10px;
    background: transparent;
    color: var(--teks);
}

/* ==============================
   PESAN DAN AKSESIBILITAS
============================== */
.pesan {
    grid-column: 1 / -1;
    margin: 0;
    padding: 30px 16px;
    border: 1px dashed var(--garis);
    border-radius: 16px;
    color: var(--redup);
    text-align: center;
}

.pesan.galat { color: var(--hapus); }

button:hover { filter: brightness(1.08); }

:focus-visible {
    outline: 2px solid #78aaff;
    outline-offset: 3px;
}

/* ==============================
   RESPONSIVE TABLET DAN HP
============================== */
@media (max-width: 700px) {
    .wadah {
        width: 100%;
        padding: 34px 20px 42px;
    }

    header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
        margin-bottom: 28px;
    }

    h1 {
        max-width: 100%;
        font-size: clamp(1.8rem, 7vw, 2.35rem);
    }

    header p { font-size: 1rem; }

    .btn-tambah {
        min-height: 50px;
        padding: 12px 20px;
    }

    .kontrol {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 12px;
    }

    .kontrol input, .kontrol select {
        min-height: 54px;
        font-size: 1rem;
    }

    .jumlah { margin: 15px 0 22px; }

    .guru-section { margin: 30px 0; }

    .bagian-header {
        align-items: center;
        margin-bottom: 14px;
    }

    .bagian-header h2 { font-size: 1.2rem; }

    .daftar, .daftar-guru {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .kartu {
        width: 100%;
        border-radius: 22px;
    }

    .pita {
        height: 94px;
        flex-basis: 94px;
    }

    .isi { padding: 0 18px 18px; }

    .foto {
        width: 116px;
        height: 116px;
        margin-top: -64px;
        margin-bottom: 12px;
    }

    .nama { font-size: 1.3rem; }
    .nis { font-size: .98rem; margin-bottom: 20px; }

    .rincian { font-size: .95rem; }
    .rincian div { padding: 12px 0; }

    .kartu-aksi button { min-height: 48px; }

    .modal { padding: 12px; }

    .modal-konten {
        padding: 21px;
        border-radius: 16px;
    }
}

@media (max-width: 380px) {
    .wadah {
        padding-right: 15px;
        padding-left: 15px;
    }

    .isi {
        padding-right: 14px;
        padding-left: 14px;
    }

    .rincian { font-size: .88rem; }
    .rincian div { gap: 9px; }

    .bagian-header {
        align-items: flex-start;
        flex-direction: column;
    }
}

/* Pilihan role pada modal tambah data */
.pilihan-role {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.pilihan-role button {
    width: 100%;
    min-height: 48px;
}

/* Dropdown role */
#filterRole {
    min-width: 150px;
}

/* Sembunyikan bagian yang tidak aktif */
[hidden] {
    display: none !important;
}

/* Tampilan HP */
@media (max-width: 600px) {
    .kontrol {
        flex-direction: column;
    }

    .kontrol input,
    .kontrol select {
        width: 100%;
        flex: 1 1 auto;
        min-height: 48px;
    }

    .pilihan-role {
        gap: 10px;
    }
}
</style>

</head>

        const cocokNama = (s.nama || "")
            .toLowerCase()
            .includes(kataKunci);

        const cocokNis = String(s.nis || "")
            .toLowerCase()
            .includes(kataKunci);

        const cocokKelas =
            !kelasDipilih || s.kelas === kelasDipilih;

        return cocokKelas && (!kataKunci || cocokNama || cocokNis);
    });

    elJumlah.textContent =
        `${hasil.length} dari ${semuaSiswa.length} siswa`;

    elDaftar.replaceChildren();

    if (hasil.length === 0) {
        tampilkanPesan(
            semuaSiswa.length === 0
                ? "Belum ada data siswa. Klik Tambah Siswa untuk mengisi."
                : "Tidak ada siswa yang cocok."
        );

        return;
    }

    hasil.forEach((s) => {
        elDaftar.appendChild(buatKartu(s));
    });
}


function buatKartu(s) {
    const kartu = el("article", "kartu");
    const hue = warnaKelas(s.kelas || "");

    const pita = el("div", "pita");

    pita.style.backgroundColor = `hsl(${hue}, 65%, 45%)`;

    kartu.appendChild(pita);

    const isi = el("div", "isi");
    const foto = el("div", "foto");

    foto.style.backgroundColor = `hsl(${hue}, 55%, 88%)`;
    foto.style.color = `hsl(${hue}, 65%, 28%)`;

    if (s.foto_url && urlFotoValid(s.foto_url)) {
        const gambar = document.createElement("img");

        gambar.src = s.foto_url;
        gambar.alt = `Foto ${s.nama}`;
        gambar.loading = "lazy";

        gambar.onerror = () => {
            foto.replaceChildren(
                document.createTextNode(inisial(s.nama))
            );
        };

        foto.appendChild(gambar);

    } else {
        foto.textContent = inisial(s.nama);
    }

    isi.appendChild(foto);
    isi.appendChild(el("h2", "nama", s.nama));
    isi.appendChild(el("p", "nis", `NIS ${s.nis}`));

    const rincian = el("dl", "rincian");

    tambahBaris(rincian, "Kelas", s.kelas);

    if (TAMPILKAN.jenisKelamin) {
        tambahBaris(
            rincian,
            "Jenis kelamin",
            s.jenis_kelamin
        );
    }

    if (TAMPILKAN.tanggalLahir) {
        tambahBaris(
            rincian,
            "Tanggal lahir",
            formatTanggal(s.tanggal_lahir)
        );
    }

    if (TAMPILKAN.alamat) {
        tambahBaris(
            rincian,
            "Alamat",
            s.alamat
        );
    }

    isi.appendChild(rincian);
    kartu.appendChild(isi);

    const aksi = el("div", "kartu-aksi");

    const btnEdit = el("button", "btn-edit", "Edit");

    btnEdit.type = "button";
    btnEdit.onclick = () => bukaModalEdit(s);

    const btnHapus = el("button", "btn-hapus", "Hapus");

    btnHapus.type = "button";
    btnHapus.onclick = () => hapusSiswa(s.nis, s.nama);

    aksi.append(btnEdit, btnHapus);

    kartu.appendChild(aksi);

    return kartu;
}

/*
 * ==========================================
 * 7. MENYIMPAN DATA SISWA KE SUPABASE
 * ==========================================
 */

async function simpanDataSiswa(event) {
    event.preventDefault();

    const action = document.getElementById("formAction").value;

    const nis = document.getElementById("inputNis").value.trim();
    const nama = document.getElementById("inputNama").value.trim();
    const kelas = document.getElementById("inputKelas").value.trim();

    const jenis_kelamin =
        document.getElementById("inputGender").value;

    const tanggal_lahir =
        document.getElementById("inputLahir").value || null;

    const alamat =
        document.getElementById("inputAlamat").value.trim();

    const fotoInput =
        document.getElementById("inputFoto").value.trim();

    if (!nis || !nama) {
        alert("NIS dan nama lengkap wajib diisi.");
        return;
    }

    if (fotoInput && !urlFotoValid(fotoInput)) {
        alert(
            "URL foto harus menggunakan alamat HTTP atau HTTPS yang valid."
        );

        return;
    }

    const payload = {
        nis,
        nama,
        kelas: kelas || null,
        jenis_kelamin: jenis_kelamin || null,
        tanggal_lahir,
        alamat: alamat || null,
        foto_url: fotoInput || null
    };

    btnSimpan.disabled = true;
    btnSimpan.textContent = "Menyimpan...";

    try {
        let error;

        if (action === "INSERT") {
            ({ error } = await db
                .from("siswa")
                .insert([payload]));

        } else if (action === "UPDATE") {
            const originalNis =
                document.getElementById("originalNis").value;

            ({ error } = await db
                .from("siswa")
                .update(payload)
                .eq("nis", originalNis));
        }

        if (error) {
            console.error("Gagal menyimpan:", error);

            alert("Gagal menyimpan data: " + error.message);
            return;
        }

        tutupModal();

        await muatData();

    } catch (error) {
        console.error(error);

        alert("Terjadi kesalahan saat menyimpan data.");

    } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = "Simpan Data";
    }
}


/*
 * ==========================================
 * 8. MENGHAPUS DATA SISWA
 * ==========================================
 */

async function hapusSiswa(nis, nama) {
    const yakin = confirm(
        `Apakah Anda yakin ingin menghapus data "${nama}"?`
    );

    if (!yakin) return;

    const { error } = await db
        .from("siswa")
        .delete()
        .eq("nis", nis);

    if (error) {
        console.error("Gagal menghapus:", error);

        alert("Gagal menghapus data: " + error.message);
        return;
    }

    await muatData();
}


/*
 * ==========================================
 * 9. FUNGSI BANTUAN UMUM
 * ==========================================
 */

function el(tag, kelas = "", teks = "") {
    const elemen = document.createElement(tag);

    if (kelas) {
        elemen.className = kelas;
    }

    if (teks !== "") {
        elemen.textContent = teks;
    }

    return elemen;
}


function tambahBaris(dl, label, nilai) {
    if (
        nilai === null ||
        nilai === undefined ||
        nilai === ""
    ) {
        return;
    }

    const baris = el("div");

    baris.append(
        el("dt", "", label),
        el("dd", "", String(nilai))
    );

    dl.appendChild(baris);
}


function inisial(nama = "") {
    return nama.trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((kata) => kata[0].toUpperCase())
        .join("");
}


function warnaKelas(kelas = "") {
    let total = 0;

    for (const huruf of kelas) {
        total += huruf.charCodeAt(0);
    }

    return (total * 47) % 360;
}


function formatTanggal(teks) {
    if (!teks) return "";

    const tanggal = new Date(`${teks}T00:00:00`);

    if (Number.isNaN(tanggal.getTime())) {
        return teks;
    }

    return tanggal.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


function urlFotoValid(teks) {
    try {
        const url = new URL(teks);

        return (
            url.protocol === "https:" ||
            url.protocol === "http:"
        );

    } catch {
        return false;
    }
}


function tampilkanPesan(teks, galat = false) {
    elDaftar.replaceChildren(
        el("p", `pesan${galat ? " galat" : ""}`, teks)
    );
}


function isiPilihanKelas() {
    const kelasDipilih = elKelas.value;

    const placeholder = el("option", "", "Semua Kelas");
    placeholder.value = "";

    elKelas.replaceChildren(placeholder);

    const daftarKelas = [
        ...new Set(
            semuaSiswa
                .map((s) => s.kelas)
                .filter(Boolean)
        )
    ].sort((a, b) => a.localeCompare(b, "id"));

    daftarKelas.forEach((kelas) => {
        const opsi = el("option", "", kelas);

        opsi.value = kelas;

        elKelas.appendChild(opsi);
    });

    if (daftarKelas.includes(kelasDipilih)) {
        elKelas.value = kelasDipilih;
    }
}


/*
 * ==========================================
 * 10. TAMPILAN DATA GURU
 * ==========================================
 */

function tampilkanGuru() {
    const kataKunci = elCari.value.trim().toLowerCase();

    const hasil = semuaGuru.filter((guru) => {
        const cocokNama = (guru.nama || "")
            .toLowerCase()
            .includes(kataKunci);

        const cocokNip = String(guru.nip || "")
            .toLowerCase()
            .includes(kataKunci);

        return !kataKunci || cocokNama || cocokNip;
    });

    elJumlahGuru.textContent =
        `${hasil.length} dari ${semuaGuru.length} guru`;

    elDaftarGuru.replaceChildren();

    if (hasil.length === 0) {
        tampilkanPesanGuru(
            semuaGuru.length === 0
                ? "Belum ada data guru."
                : "Tidak ada guru yang cocok."
        );

        return;
    }

    hasil.forEach((guru) => {
        elDaftarGuru.appendChild(buatKartuGuru(guru));
    });
}

function perbaruiTampilanRole() {
    const role = elRole.value;

    if (role === "siswa") {
        bagianSiswa.hidden = false;
        bagianGuru.hidden = true;

        elKelas.hidden = false;

        tampilkanSiswa();

    } else if (role === "guru") {
        bagianSiswa.hidden = true;
        bagianGuru.hidden = false;

        elKelas.hidden = true;
    }
}


function buatKartuGuru(guru) {
    const kartu = el("article", "kartu kartu-guru");
    const hue = warnaKelas(guru.jurusan || ""); // Menggunakan jurusan untuk variasi warna pita

    const pita = el("div", "pita");
    pita.style.backgroundColor = `hsl(${hue}, 65%, 45%)`;
    kartu.appendChild(pita);

    const isi = el("div", "isi");
    const foto = el("div", "foto");
    foto.style.backgroundColor = `hsl(${hue}, 55%, 88%)`;
    foto.style.color = `hsl(${hue}, 65%, 28%)`;
    foto.textContent = inisial(guru.nama);
    isi.appendChild(foto);

    isi.appendChild(el("h2", "nama", guru.nama));
    isi.appendChild(el("p", "nis", guru.mata_pelajaran));

    const rincian = el("dl", "rincian");
    tambahBaris(rincian, "Jurusan", guru.jurusan);
    tambahBaris(rincian, "Jenis kelamin", guru.jenis_kelamin);
    tambahBaris(rincian, "Email", guru.email);
    tambahBaris(rincian, "Alamat", guru.alamat);

    isi.appendChild(rincian);
    kartu.appendChild(isi);

    const aksi = el("div", "kartu-aksi");

    const btnEdit = el("button", "btn-edit", "Edit");
    btnEdit.type = "button";
    btnEdit.onclick = () => bukaModalEditGuru(guru);

    const btnHapus = el("button", "btn-hapus", "Hapus");
    btnHapus.type = "button";
    btnHapus.onclick = () => hapusGuru(guru.id, guru.nama);

    aksi.append(btnEdit, btnHapus);
    kartu.appendChild(aksi);

    return kartu;
}



/*
 * ==========================================
 * 11. FILTER GURU
 * ==========================================
 */

function isiPilihanGuru() {
    const guruDipilih = elGuru.value;

    const placeholder = el("option", "", "Semua Guru");
    placeholder.value = "";

    elGuru.replaceChildren(placeholder);

    semuaGuru
        .slice()
        .sort((a, b) => a.nama.localeCompare(b.nama, "id"))
        .forEach((guru) => {
            const opsi = el("option", "", guru.nama);

            opsi.value = guru.id;

            elGuru.appendChild(opsi);
        });

    if (semuaGuru.some((guru) => guru.id === guruDipilih)) {
        elGuru.value = guruDipilih;
    }
}


function tampilkanPesanGuru(teks, galat = false) {
    elDaftarGuru.replaceChildren(
        el("p", `pesan${galat ? " galat" : ""}`, teks)
    );
}

function perbaruiTampilanRole() {
    const role = elRole.value;

    if (role === "siswa") {
        bagianSiswa.hidden = false;
        bagianGuru.hidden = true;

        elKelas.hidden = false;

        tampilkanSiswa();

    } else if (role === "guru") {
        bagianSiswa.hidden = true;
        bagianGuru.hidden = false;

        elKelas.hidden = true;

        tampilkanGuru();
    }
}

 * ==========================================
 * 12. FORM TAMBAH DAN EDIT GURU

 */

function bukaModalTambahGuru() {
    formGuru.reset();

    document.getElementById("guruId").value = "";

    document.getElementById("modalGuruJudul").textContent =

}

}

    if (role === "siswa") {
        bukaModalTambah();
    } else if (role === "guru") {

    }

/*
 * ==========================================
 * 13. PENYIMPANAN DATA GURU
 * ==========================================
 */

function simpanSemuaGuru(daftarGuru) {
    try {
        localStorage.setItem(
            KUNCI_PENYIMPANAN_GURU,
            JSON.stringify(daftarGuru)
        );

        return true;

    } catch (error) {
        console.error("Gagal menyimpan data guru:", error);

        alert("Data guru gagal disimpan di penyimpanan browser.");

        return false;
    }
}


function simpanDataGuru(event) {
    event.preventDefault();

    const id = document.getElementById("guruId").value;

    const guru = {
        id: id || `guru-${Date.now()}-${Math.random().toString(36).slice(2)}`,

        nama: document.getElementById("guruNama").value.trim(),

        mata_pelajaran: document
            .getElementById("guruMapel")
            .value.trim(),

        jenis_kelamin: document
            .getElementById("guruGender")
            .value,

        alamat: document
            .getElementById("guruAlamat")
            .value.trim(),

        email: document
            .getElementById("guruEmail")
            .value.trim(),

        jurusan: document
            .getElementById("guruJurusan")
            .value
    };

    const daftarGuru = id
        ? semuaGuru.map((data) => data.id === id ? guru : data)
        : [...semuaGuru, guru];

    if (!simpanSemuaGuru(daftarGuru)) {
        return;
    }

    semuaGuru = daftarGuru;

    tampilkanGuru();
    tutupModalGuru();
}


/*
 * ==========================================
 * 14. MENGHAPUS DATA GURU
 * ==========================================
 */

function hapusGuru(id, nama) {
    if (
        !confirm(
            `Apakah Anda yakin ingin menghapus data "${nama}"?`
        )
    ) {
        return;
    }

    const daftarGuru = semuaGuru.filter(
        (guru) => guru.id !== id
    );

    if (!simpanSemuaGuru(daftarGuru)) {
        return;
    }

    semuaGuru = daftarGuru;

    if (elGuru.value === id) {
        elGuru.value = "";
    }

    tampilkanGuru();
}
